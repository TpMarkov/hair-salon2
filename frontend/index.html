<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/compressed/logo.png" />

    <!-- Preload Critical Assets -->
    <link
      rel="preload"
      href="/fonts/pacifico-regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link rel="preload" href="/compressed/logo.png" as="image" />
    <link
      rel="preload"
      href="/compressed/hero_bg_optimized.png"
      as="image"
      fetchpriority="high"
    />
    <link rel="modulepreload" href="/src/main.jsx" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Най-добрият фризьорски салон в Ловеч (5500). Предлагаме подстригване, боядисване, официални прически и терапии за коса. Запишете час онлайн!"
    />
    <title>Фризьорски Салон в Ловеч | Професионални Фризьорски Услуги</title>

    <!-- Critical CSS to prevent FOUC and speed up initial render -->
    <style>
      :root {
        --color-primary-start: #fcd34d;
        --color-primary-middle: #eab308;
        --color-primary-end: #b45309;
      }

      .logo-font {
        font-family: "Logo-Font", sans-serif !important;
      }

      @font-face {
        font-family: "Logo-Font";
        src: url("/fonts/pacifico-regular.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }

      .bg-primary-gradient {
        background-image: linear-gradient(
          to right,
          var(--color-primary-start),
          var(--color-primary-middle),
          var(--color-primary-end)
        );
      }

      /* LCP Placeholder Styles to match Header.jsx exactly */
      .lcp-placeholder {
        position: relative;
        width: calc(100% + 2.5rem);
        margin-left: -1.25rem;
        margin-right: -1.25rem;
        overflow: hidden;
        height: 550px;
      }

      @media (min-width: 768px) {
        .lcp-placeholder {
          height: 650px;
        }
      }

      @media (min-width: 1024px) {
        .lcp-placeholder {
          height: 800px;
        }
      }

      .lcp-placeholder img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .lcp-placeholder .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 0.8),
          rgba(0, 0, 0, 0.4),
          transparent
        );
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Static LCP Placeholder: Painted by browser BEFORE JS executes -->
      <div class="lcp-placeholder">
        <img src="/images/hero_bg_optimized.png" alt="" fetchpriority="high" />
        <div class="overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
